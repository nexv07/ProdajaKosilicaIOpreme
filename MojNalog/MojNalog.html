<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moj nalog | Kosilice Plus</title>
  <link rel="stylesheet" href="../Oglasi/Oglasi.css">
  <link rel="stylesheet" href="MojNalog.css">
</head>
<body>
  <header>
    <h1 class="logo"><img src="../SajtZaProdajuKosilica/Images/kosilicalogo.png" alt="Kosilica"> <span>Kosilice Plus</span></h1>
    <nav><a href="../SajtZaProdajuKosilica/SajtZaProdajuKosilica.html#ponuda">Ponuda</a><a href="../SajtZaProdajuKosilica/SajtZaProdajuKosilica.html#kontakt">Kontakt</a><a href="../Oglasi/Oglasi.html">Oglasi</a><div class="korisnik" id="korisnik"></div></nav>
  </header>
  <main class="nalog-main">
    <section class="nalog-okvir">
      <h2>Moj nalog</h2>
      <p class="nalog-opis">Izmenite svoje podatke naloga.</p>
      <form id="forma-naloga">
        <div class="polje"><label for="ime">Ime</label><input id="ime" name="ime" type="text" autocomplete="given-name" required></div>
        <div class="polje"><label for="prezime">Prezime</label><input id="prezime" name="prezime" type="text" autocomplete="family-name" required></div>
        <div class="polje"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="polje"><label for="broj-telefona">Broj telefona</label><input id="broj-telefona" name="brojTelefona" type="tel" autocomplete="tel" required></div>
        <div class="polje"><label for="lozinku">Nova lozinka <small>(opciono)</small></label><input id="lozinku" name="lozinku" type="password" minlength="6" autocomplete="new-password"></div>
        <div class="polje"><label for="potvrda-lozinke">Potvrda nove lozinke</label><input id="potvrda-lozinke" name="potvrdaLozinke" type="password" minlength="6" autocomplete="new-password"></div>
        <button class="dugme" type="submit">Sačuvaj izmene</button>
      </form>
      <p id="poruka" class="poruka" aria-live="polite"></p>
    </section>
  </main>
  <script src="MojNalog.js"></script>
</body>
</html>
