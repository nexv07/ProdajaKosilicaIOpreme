<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moji oglasi | Kosilice Plus</title>
  <link rel="stylesheet" href="../Oglasi/Oglasi.css">
  <link rel="stylesheet" href="MojiOglasi.css">
</head>
<body>
  <header>
    <h1 class="logo"><img src="../SajtZaProdajuKosilica/Images/kosilicalogo.png" alt="Kosilica"> <span>Kosilice Plus</span></h1>
    <nav><a href="../SajtZaProdajuKosilica/SajtZaProdajuKosilica.html#ponuda">Ponuda</a><a href="../SajtZaProdajuKosilica/SajtZaProdajuKosilica.html#kontakt">Kontakt</a><a href="../Oglasi/Oglasi.html">Oglasi</a><div class="korisnik" id="korisnik"></div></nav>
  </header>
  <main class="moji-main">
    <section class="moji-okvir">
      <h2>Moji oglasi</h2>
      <p id="poruka" class="poruka" aria-live="polite"></p>
      <div id="lista-mojih-oglasa" class="lista-mojih-oglasa"></div>
    </section>
    <section id="izmena-okvir" class="forma-okvir" hidden>
      <h2>Izmena oglasa</h2>
      <form id="forma-izmena" enctype="multipart/form-data">
        <input id="id-oglasa" name="idOglasa" type="hidden">
        <div class="polje"><label for="ime-oglasa">Ime oglasa</label><input id="ime-oglasa" name="imeOglasa" type="text" required></div>
        <div class="polje"><label for="vrsta-pogona">Vrsta pogona</label><select id="vrsta-pogona" name="vrstaPogona" required><option value="Benzin/mesavina">Benzin/mesavina</option><option value="Elektro">Elektro</option><option value="Akumulatorski">Akumulatorski</option><option value="Ostalo">Ostalo</option></select></div>
        <div class="polje"><label for="cena">Cena</label><input id="cena" name="cena" type="number" min="0" step="0.01" required></div>
        <div class="polje"><label for="slika">Nova slika proizvoda <small>(opciono)</small></label><input id="slika" name="slika" type="file" accept="image/*"><img id="trenutna-slika" class="trenutna-slika" alt="Trenutna slika oglasa"></div>
        <fieldset class="polje stanje"><legend>Stanje proizvoda</legend><label><input type="radio" name="stanje" value="Polovno" required> Polovno</label><label><input type="radio" name="stanje" value="Novo"> Novo</label></fieldset>
        <div class="polje"><label for="mesto-prodavca">Mesto prodavca</label><input id="mesto-prodavca" name="mestoProdavca" type="text" required></div>
        <div class="polje"><label for="dodatne-informacije">Dodatne informacije</label><textarea id="dodatne-informacije" name="dodatneInformacije" rows="5" required></textarea></div>
        <div class="polje"><label for="status">Status oglasa</label><select id="status" name="status" required><option value="Aktivan">Aktivan</option><option value="Neaktivan">Neaktivan</option><option value="Prodat">Prodat</option></select></div>
        <button class="dugme" type="submit">Sačuvaj izmene</button>
        <div class="dugmad-izmene">
          <button id="obrisi-oglas" class="dugme dugme-obrisi" type="button">Obriši oglas</button>
        </div>
      </form>
      <p id="poruka-izmene" class="poruka" aria-live="polite"></p>
    </section>
  </main>
  <script src="MojiOglasi.js"></script>
</body>
</html>
