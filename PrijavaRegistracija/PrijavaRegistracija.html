<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava i registracija | Kosilice Plus</title>
  <link rel="stylesheet" href="PrijavaRegistracija.css">
</head>
<body>
  <main class="okvir">
    <div class="zaglavlje">
      <a href="../SajtZaProdajuKosilica/SajtZaProdajuKosilica.html">Kosilice Plus</a>
      <h1>Dobrodošli</h1>
      <p class="podnaslov">Prijavite se ili napravite novi nalog</p>
    </div>
    <div class="tabovi"><button class="tab aktivan" id="tab-prijava" type="button">Prijava</button><button class="tab" id="tab-registracija" type="button">Novi nalog</button></div>

    <form id="forma-prijava">
      <div class="polje"><label for="prijava-email">Email</label><input id="prijava-email" type="email" autocomplete="email" required></div>
      <div class="polje"><label for="prijava-lozinku">Lozinka</label><input id="prijava-lozinku" type="password" autocomplete="current-password" required></div>
      <button class="dugme" type="submit">Uloguj se</button>
    </form>

    <form id="forma-registracija" class="sakriveno">
      <div class="polje"><label for="registracija-ime">Ime</label><input id="registracija-ime" type="text" autocomplete="given-name" required></div>
      <div class="polje"><label for="registracija-prezime">Prezime</label><input id="registracija-prezime" type="text" autocomplete="family-name" required></div>
      <div class="polje"><label for="registracija-email">Email</label><input id="registracija-email" type="email" autocomplete="email" required></div>
      <div class="polje"><label for="registracija-lozinku">Lozinka</label><input id="registracija-lozinku" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="polje"><label for="registracija-broj-telefona">Broj telefona</label><input id="registracija-broj-telefona" type="tel" autocomplete="tel" required></div>
      <button class="dugme" type="submit">Napravi nalog</button>
    </form>
    <p id="poruka" class="poruka" aria-live="polite"></p>
    <p class="napomena">Nalozi se čuvaju u bazi podataka.</p>
  </main>
  <script src="PrijavaRegistracija.js"></script>
</body>
</html>
